dataset_name: "HDFS_small"
title: "HDFS-small Embedding Comparison"
output_dir: "experiments/behavior_log/artifacts/comparison/HDFS_small"
csv_file: "comparison_table.csv"
markdown_file: "comparison_table.md"
summary_file: "comparison_summary.json"
primary_metric: "linear_probe_test_macro_f1"
digits: 4
allow_missing: true

metrics:
  - "linear_probe_test_macro_f1"
  - "linear_probe_test_auroc"
  - "linear_probe_test_auprc"
  - "linear_probe_test_anomaly_recall"
  - "linear_probe_test_anomaly_precision"
  - "retrieval_overall_p_at_5_test"
  - "retrieval_anomaly_p_at_5_test"
  - "retrieval_normal_p_at_5_test"
  - "retrieval_overall_p_at_10_test"
  - "retrieval_anomaly_p_at_10_test"
  - "retrieval_normal_p_at_10_test"
  - "structure_event_count_cosine_at_5_test"
  - "structure_ngram_cosine_at_5_test"

methods:
  - name: "occurrence_identity"
    display_name: "Occurrence Identity"
    metrics_path: "experiments/behavior_log/artifacts/evaluation/HDFS_small/occurrence_identity/metrics.json"
  - name: "tfidf_svd"
    display_name: "TF-IDF SVD"
    metrics_path: "experiments/behavior_log/artifacts/evaluation/HDFS_small/tfidf_svd/metrics.json"
  - name: "ts2vec_style_trace"
    display_name: "Contrastive TCN"
    metrics_path: "experiments/behavior_log/artifacts/evaluation/HDFS_small/ts2vec_style_trace/metrics.json"
  - name: "reconstruction_tcn"
    display_name: "Reconstruction TCN"
    metrics_path: "experiments/behavior_log/artifacts/evaluation/HDFS_small/reconstruction_tcn/metrics.json"
  - name: "reconstruction_bigru"
    display_name: "Reconstruction BiGRU"
    metrics_path: "experiments/behavior_log/artifacts/evaluation/HDFS_small/reconstruction_bigru/metrics.json"
  - name: "hybrid_tcn"
    display_name: "Hybrid TCN"
    metrics_path: "experiments/behavior_log/artifacts/evaluation/HDFS_small/hybrid_tcn/metrics.json"
